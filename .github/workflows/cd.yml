name: Todo App CD

on:
  workflow_run:
    workflows:
      - "Todo App CI"
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t todo-list-app:latest .
          docker tag todo-list-app:latest $ECR_REGISTRY/todo-list-app:latest

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/todo-list-app:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-south-1 | \
            docker login \
              --username AWS \
              --password-stdin 987020212262.dkr.ecr.ap-south-1.amazonaws.com

            docker pull 987020212262.dkr.ecr.ap-south-1.amazonaws.com/todo-list-app:latest

            docker stop todo-container || true
            docker rm todo-container || true

            docker run -d \
              --name todo-container \
              --restart unless-stopped \
              -p 8501:8501 \
              987020212262.dkr.ecr.ap-south-1.amazonaws.com/todo-list-app:latest


